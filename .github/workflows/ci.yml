name: Security CI Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: SAST‑Bandit static code scan
        run: bandit -r ./app.py -f json -o bandit-report.json || true

      - name: SCA‑Safety dependency vulnerability scan
        run: safety check --json > safety-report.json || true

      - name: List generated report files
        run: ls -la *.json

      - name: Upload Bandit JSON report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-json-report
          path: bandit-report.json

      - name: Upload Safety JSON report
        uses: actions/upload-artifact@v4
        with:
          name: safety-json-report
          path: safety-report.json
